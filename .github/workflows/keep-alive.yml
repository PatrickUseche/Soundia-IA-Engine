name: Mantener despiertos los servicios

# AVISO: GitHub no garantiza las tareas programadas y en la practica este cron no llego a ejecutarse (0 ejecuciones en
# 4 horas). El mecanismo fiable es el Worker de Cloudflare de la carpeta keep-alive/ (cada 5 min). Este workflow queda
# para lanzarlo a mano con "Run workflow" (por ejemplo, antes de la demo) y como respaldo si GitHub si lo ejecuta.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Consultar motor y API
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MOTOR_URL: https://soundia-motor.onrender.com/health/
      API_URL: https://soundia-api-6c3t.onrender.com/
    steps:
      - name: Motor (debe responder 200 con la base de datos viva)
        run: |
          curl --silent --show-error --fail --max-time 180 --retry 2 --retry-delay 15 --retry-all-errors "$MOTOR_URL"
          echo

      - name: API (cualquier respuesta menor de 500 basta para despertarlo)
        run: |
          codigo=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 180 --retry 2 --retry-delay 15 --retry-all-errors "$API_URL")
          echo "El API respondio $codigo"
          test "$codigo" -lt 500
