name: Mantener despiertos los servicios

# El plan gratuito de Render duerme cada servicio tras 15 minutos sin trafico y despertarlo tarda de 40 s a 2 min.
# Esta tarea los consulta cada 10 minutos. Tambien toca la base de datos (via /health/), que asi no se queda dormida.
# GitHub puede retrasar las tareas programadas unos minutos y las desactiva tras 60 dias sin actividad en el repositorio
# (si pasa, se reactiva desde la pestana Actions). Se puede lanzar a mano con "Run workflow", por ejemplo antes de la demo.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Consultar motor y API
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MOTOR_URL: https://soundia-motor.onrender.com/health/
      API_URL: https://soundia-api-6c3t.onrender.com/
    steps:
      - name: Motor (debe responder 200 con la base de datos viva)
        run: |
          curl --silent --show-error --fail --max-time 180 --retry 2 --retry-delay 15 --retry-all-errors "$MOTOR_URL"
          echo

      - name: API (cualquier respuesta menor de 500 basta para despertarlo)
        run: |
          codigo=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 180 --retry 2 --retry-delay 15 --retry-all-errors "$API_URL")
          echo "El API respondio $codigo"
          test "$codigo" -lt 500
